<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente para o texto principal -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Gradiente de brilho da borda animada -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Efeito de Blur para o Neon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: #05050a; }
    
    /* Grid de fundo futurista */
    .grid-line { stroke: #111526; stroke-width: 1; opacity: 0.5; }

    /* Tipografia */
    .title { 
      font-family: 'Segoe UI', -apple-system, sans-serif; 
      font-weight: 800; 
      font-size: 28px; 
      fill: url(#textGrad); 
      filter: url(#glow);
      letter-spacing: 1px;
    }
    .subtitle { 
      font-family: 'Courier New', monospace; 
      font-size: 14px; 
      fill: #00f2fe; 
    }
    .tech { 
      font-family: 'Courier New', monospace; 
      font-weight: bold;
      font-size: 13px; 
      fill: #a78bfa; 
    }
    .bracket { fill: #f43f5e; font-weight: bold; }
    .status-text {
      font-family: 'Courier New', monospace;
      font-size: 10px;
      fill: #10b981;
      letter-spacing: 1px;
    }

    /* Animação da Borda Neon (traço correndo) */
    .neon-border {
      fill: none;
      stroke: url(#borderGrad);
      stroke-width: 2.5;
      stroke-dasharray: 400 600;
      stroke-dashoffset: 0;
      animation: dashMove 4s linear infinite;
    }

    @keyframes dashMove {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    /* Animação sutil de flutuação */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
      100% { transform: translateY(0px); }
    }
    .content-group { animation: float 5s ease-in-out infinite; }
  </style>

  <!-- Fundo Escuro -->
  <rect width="800" height="200" rx="12" class="bg" />
  
  <!-- Linhas de grade futuristas no fundo -->
  <line x1="0" y1="50" x2="800" y2="50" class="grid-line" />
  <line x1="0" y1="100" x2="800" y2="100" class="grid-line" />
  <line x1="0" y1="150" x2="800" y2="150" class="grid-line" />
  <line x1="200" y1="0" x2="200" y2="200" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="200" class="grid-line" />

  <!-- Borda Estática de Fundo -->
  <rect x="15" y="15" width="770" height="170" rx="8" fill="none" stroke="#1e1b4b" stroke-width="2" />

  <!-- Borda Animada Futurista (Neon) -->
  <rect x="15" y="15" width="770" height="170" rx="8" class="neon-border" />

  <!-- Grupo com conteúdos e animação de flutuação -->
  <g class="content-group">
    <!-- Detalhes HUD nos cantos -->
    <path d="M 25 25 L 35 25 M 25 25 L 25 35" stroke="#00f2fe" stroke-width="2" fill="none" />
    <path d="M 775 25 L 765 25 M 775 25 L 775 35" stroke="#00f2fe" stroke-width="2" fill="none" />
    <path d="M 25 175 L 35 175 M 25 175 L 25 165" stroke="#00f2fe" stroke-width="2" fill="none" />
    <path d="M 775 175 L 765 175 M 775 175 L 775 165" stroke="#00f2fe" stroke-width="2" fill="none" />

    <!-- Nome -->
    <text x="45" y="65" class="title">JOÃO VICTOR CASTOR</text>
    
    <!-- Subtítulo: Estudante de TI // System Developer -->
    <text x="45" y="98" class="subtitle">
      <tspan class="bracket">&gt;</tspan> Estudante de TI // System Developer
    </text>
    
    <!-- Stack Tecnológica: [ HTML ] • [ CSS ] • [ C# ] • [ SQL ] -->
    <text x="45" y="142" class="tech">[ HTML ]  •  [ CSS ]  •  [ C# ]  •  [ SQL ]</text>

    <!-- Indicador ONLINE com ponto verde pulsante -->
    <g transform="translate(680, 78)">
      <circle cx="10" cy="10" r="4" fill="#10b981" filter="url(#glow)"/>
      <circle cx="10" cy="10" r="8" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6">
        <animate attributeName="r" values="4;12" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="13.5" class="status-text">ONLINE</text>
    </g>
  </g>
</svg>
